<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bordas</title>

  <style>
    h1{
      background: rgb(189, 170, 6);
      padding: 20px;
      margin: 20px;
      margin-top: 50px;
      font-size: 80px;
      border-bottom: 10px  dotted;
      border-top-left-radius: 50px;
      border-top-right-radius: 50px;
      }

    p {
      background: lightblue;
      padding: 20px;
      margin: 20px;
      margin-top: 50px;
      font-size: 40px;
      border-radius: 40px;
      border-right: 30px solid purple;
      border-left: 30px solid purple;
    }
  </style>
</head>
<body>
<h1>Modelo de caixa</h1>
<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Tenetur, dicta atque quidem, neque odio vitae, consequuntur ipsum quisquam eaque suscipit nulla ex veritatis perferendis magnam totam quibusdam dolore asperiores amet!</p>
</body>
</html>
