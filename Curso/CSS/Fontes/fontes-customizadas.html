<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fontes-customizadas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap');

    @font-face {
      font-family: 'maluco';
         src: url(zombie_3/Zombie\ Blood.otf);
    }

    h1, p {
     
      font-family: 'maluco', Arial, Helvetica, sans-serif;
      color: red;
      font-size: 8rem;
      font-style: oblique;
    }

    h2{
       font-family: "Bitcount Single", system-ui;
       font-variation-settings:
       "slnt" 0,
       "CRSV" 0.5,
       "ELSH" 0,
       "ELXP" 0;
       font-size: 4rem ;
       color: lightgreen;
}
   
   
  </style>
</head>
<body>
  <h1>Feliz Natal</h1>
  <h2>Boas Festas</h2>
  <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quaerat, tempora, id, vitae maiores et repellat asperiores quod ad saepe similique nostrum harum eveniet omnis provident repudiandae aspernatur? Alias, excepturi id.</p>
</body>
</html>
