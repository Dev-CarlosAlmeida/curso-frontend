<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Tabelas</title>
  </head>
  <body>
    <div>
      <h1>Tabelas - exercício</h1>

      <table>
        <caption>
          Lista de países mais populosos
        </caption>
        <thead>
          <tr>
            <th>Posição</th>
            <th>País</th>
            <th>População aproximada (milhões)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td><img src="img/b1.jpg" alt="Bandeira da China" />China</td>
            <td>1.440</td>
          </tr>
          <tr>
            <td>2</td>
            <td><img src="img/b2.jpg" alt="Bandeira da Índia" />Índia</td>
            <td>1.380</td>
          </tr>
          <tr>
            <td>3</td>
            <td>
              <img src="img/b3.jpg" alt="Bandeira do Estados Unidos" />Estados
              Unidos
            </td>
            <td>331</td>
          </tr>
          <tr>
            <td>4</td>
            <td>
              <img src="img/b4.jpg" alt="Bandeira da Indonésia" />Indonésia
            </td>
            <td>273</td>
          </tr>
          <tr>
            <td>5</td>
            <td>
              <img src="img/b5.jpg" alt="Bandeira do Paquistão" />Paquistão
            </td>
            <td>220</td>
          </tr>
          <tr>
            <td>6</td>
            <td><img src="img/b6.jpg" alt="Bandeira do Brasil" />Brasil</td>
            <td>212</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3">Fonte: ficticio.com.br</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </body>
</html>
