<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício de Formulário</title>
</head>
<body>
  <h1>Exercício de Formulário</h1>
  <form action="processa.html" method="get">
  <fieldset>

    <legend>Dados pessoais</legend>
     
    <br>

    <label for="nome">Nome</label><br>
    <input type="nome" name="nome" id="nome">

    <br>
    
    <label for="email">Email</label> <br>
    <input type="email" name="email" id="email"> 
    
    <br>

    
    <input type="checkbox" name="reber_email" value="ativado"> 
    <label >Quro receber e-mail</label>
    
    <br><br>
    
    <label for="senha">Senha</label><br>
    <input type="password" name="senha" id="senha">
    
  </fieldset>

  <br>

  <fieldset>
    <legend>Informações adicionais</legend>
    <input type="radio" name="tipo" id="pf" value="PF">
    <label for="pf" > Pessoa Física</label>

    <input type="radio" name="tipo" id="pj" value="PJ">
    <label for="pj"> Pessoa Jurídica</label>
  </fieldset>
  
  <br>

  <input type="submit" value="Cadastar">
</form>
</body>
</html>
